CONFIG_ADC=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_GPIO=y
CONFIG_SPI=y
#CONFIG_WS2812_STRIP=y
#CONFIG_LED_STRIP=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Mic-Sense"
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_GATT_DYNAMIC_DB=y

CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_EVT_RX_COUNT=10

# TX Power: kept at +8 dBm for maximum range
# This was intentionally set for the Jack Jack project to achieve maximum BLE range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Coded PHY removed for iPhone compatibility
# CONFIG_BT_CTLR_PHY_CODED=y
# CONFIG_BT_PHY_UPDATE=y
# CONFIG_BT_EXT_ADV=y

# Longer connection interval = better battery + range
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=160
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=320
CONFIG_BT_PERIPHERAL_PREF_LATENCY=2
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# [BAT-OPT-8] Disable logging for production/field builds.
#
# CONFIG_LOG=y keeps the logging subsystem active — it allocates message
# buffers, processes log calls even when nothing is connected to RTT,
# and adds overhead to every printk()/LOG_xxx() call.
# RTT itself keeps a background thread waiting for a debugger.
#
# For development: keep these enabled (comment out the =n lines).
# For production flash: enable the =n lines to save ~1–2 mA and
# reduce flash/RAM usage.
#
# CONFIG_LOG=n
# CONFIG_RTT_CONSOLE=n
# CONFIG_USE_SEGGER_RTT=n

CONFIG_RTT_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG=y

# RC oscillator — required since board has no LF crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y

# [BAT-OPT-9] Zephyr Power Management.
#
# Enables the PM subsystem which allows the kernel to put the nRF52
# into WFI (Wait For Interrupt) / low-power idle between scheduler
# ticks instead of busy-spinning. This works together with the
# k_msleep() call added in main.c [BAT-OPT-1] — without CONFIG_PM=y,
# k_msleep() still sleeps but the SoC stays in a shallow idle.
# With CONFIG_PM=y, the nRF52 enters a deeper sleep state during the
# ~8 ms inter-frame idle, cutting idle current from ~1.5 mA to ~5 µA.
CONFIG_PM=y
CONFIG_PM_DEVICE=y