CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y

# Console over SEGGER RTT (this board has no USB-UART bridge to the NINA).
# View logs in SEGGER RTT Viewer / JLinkRTTViewer over the SWD link.
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# Analog mic (MAX9814) via the nRF52833 SAADC. I2C kept for the (disabled)
# battery gauge so that code still compiles.
CONFIG_ADC=y
CONFIG_I2C=y

CONFIG_FPU=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Bluetooth LE peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Mic-Sense"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_DEVICE_APPEARANCE=0

# Persistent settings (threshold + calibration offset) via NVS
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# ── Low-frequency clock source ──
# The Sound Sensor V0.3 board (NINA-B406) has NO external 32.768 kHz crystal
# (XL1/XL2 unconnected). Use the internal RC oscillator (500 ppm) with
# calibration, otherwise BLE connections drop right after connecting (0x3e).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_PERIOD=2000
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_MAX_SKIP=0
