CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y

# Console over SEGGER RTT (this board has no USB-UART bridge to the NINA).
# View logs in SEGGER RTT Viewer / JLinkRTTViewer over the SWD link.
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

CONFIG_I2S=y
CONFIG_I2C=y

CONFIG_FPU=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Bluetooth LE peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Mic-Sense"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_DEVICE_APPEARANCE=0

# Persistent settings (threshold + calibration offset) via NVS
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# ── Low-frequency clock source ──
# The Sound Sensor V0.3 board (NINA-B406) has NO external 32.768 kHz crystal
# (XL1/XL2 unconnected). The nRF52833 DK target otherwise assumes one, which
# makes BLE connections drop right after connecting (HCI reason 0x3e).
# Use the internal RC oscillator instead (sets clock accuracy to 500 ppm).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
# Periodically re-calibrate the RC LFCLK against the HF clock, otherwise it
# drifts with temperature and the BLE link drops with a supervision timeout.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
# Calibrate aggressively and early: every 2 s, never skipping. The RC is
# uncalibrated right after boot (worst drift), which is exactly when the phone
# first connects — frequent calibration keeps the link from dropping (0x3e).
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_PERIOD=2000
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_MAX_SKIP=0